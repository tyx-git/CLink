<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CLink 数据流图</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="应用品牌">CLink 数据流图</div>
        <div class="view-status" aria-live="polite">
          <span class="view-status__eyebrow">当前视图</span>
          <span id="current-view-label" class="view-status__label">加载中</span>
        </div>
        <label class="search-box">
          <span class="search-box__label">搜索</span>
          <input id="graph-search" type="search" aria-label="搜索节点、边、分组" autocomplete="off">
        </label>
        <div class="plane-toggles" aria-label="图谱筛选器">
          <button type="button" data-toggle="control" aria-pressed="true">控制</button>
          <button type="button" data-toggle="data" aria-pressed="true">数据</button>
          <button type="button" data-toggle="risk" aria-pressed="true">风险</button>
          <button type="button" data-toggle="source" aria-pressed="true">源码</button>
          <button type="button" data-toggle="ipv4" aria-pressed="true">IPv4</button>
          <button type="button" data-toggle="ipv6" aria-pressed="true">IPv6</button>
        </div>
      </header>

      <aside class="side-nav" aria-label="数据流图视图">
        <div class="panel-heading">视图</div>
        <nav id="view-nav" class="view-nav"></nav>
      </aside>

      <main class="graph-stage" aria-labelledby="graph-title">
        <section class="graph-summary">
          <p class="kicker">静态分析图谱</p>
          <h1 id="graph-title">加载图谱</h1>
          <p id="graph-description" class="graph-description"></p>
          <div id="graph-badges" class="badge-row" aria-label="视图徽标"></div>
        </section>
        <svg id="graph-svg" class="graph-svg" role="img" aria-label="CLink 数据流图谱"></svg>
      </main>

      <aside class="detail-panel" aria-label="视图详情">
        <div class="tabs" role="tablist" aria-label="详情分区">
          <button type="button" data-tab="overview" class="is-active" role="tab" aria-selected="true">概览</button>
          <button type="button" data-tab="deep" role="tab" aria-selected="false">深度</button>
          <button type="button" data-tab="source" role="tab" aria-selected="false">源码</button>
          <button type="button" data-tab="risk" role="tab" aria-selected="false">风险</button>
          <button type="button" data-tab="debug" role="tab" aria-selected="false">调试</button>
        </div>
        <section id="detail-content" class="detail-content" tabindex="0"></section>
      </aside>
    </div>

    <script src="assets/graph-data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
