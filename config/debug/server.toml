# Debug Server Config — Linux relay server (v1.3.0)
# Listens for incoming client connections and relays traffic between them.

[service]
role = "service"

[network]
listen_endpoint = "tcp://0.0.0.0:4433"
allow_self_connect_for_debug = true
allow_self_connect = true
bandwidth_limit = 0  # unlimited for debug

[security]
credential_provider = "psk"

[observability]
log_level = "trace"

[logging]
level = "trace"
format = "simple"
pattern = "%Y-%m-%d %H:%M:%S.%e [%n] [%l] %v"
async = true
queue_size = 8192
flush_interval = 1

[auth]
psk_list = ["admin:", "user1:"]

[client]
remote_endpoint = "tcp://127.0.0.1:4433"

[policy.global]
max_bandwidth_up = 0
max_bandwidth_down = 0
session_timeout = 0
allow_split_tunneling = true
allowed_subnets = ["0.0.0.0/0"]

[[logging.sinks]]
type = "console"
enabled = true
level = "trace"

[[logging.sinks]]
type = "rotating"
enabled = true
level = "trace"
path = "logs/debug-server.log"
max_size = "10MB"
max_files = 3
